<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>粒子变形 · 粒子形态实验室</title>
  <style>
    :root { color-scheme: dark; --accent:#ff9e2a; --panel:rgba(18,18,22,.72); }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050505; }
    body { font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:#fff; }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
      background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 32%),
                 linear-gradient(rgba(255,255,255,.017) 1px,transparent 1px),
                 linear-gradient(90deg,rgba(255,255,255,.017) 1px,transparent 1px);
      background-size:auto,44px 44px,44px 44px;
      -webkit-mask-image:radial-gradient(circle at center,#000,transparent 75%);
    }
    canvas { position:fixed; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
    canvas:active { cursor:grabbing; }
    .brand { position:fixed; top:24px; left:28px; z-index:2; display:flex; align-items:center; gap:10px; }
    .mark { width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 22px var(--accent); }
    .brand span { font-size:11px; font-weight:650; letter-spacing:.24em; color:rgba(255,255,255,.72); }
    .status { position:fixed; top:22px; left:50%; z-index:2; transform:translateX(-50%); padding:8px 14px; border:1px solid rgba(255,255,255,.1); border-radius:999px; background:rgba(10,10,12,.55); backdrop-filter:blur(14px); color:rgba(255,255,255,.54); font:500 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace; letter-spacing:.12em; text-transform:uppercase; transition:.25s; }
    .status.active { color:#fff; border-color:color-mix(in srgb,var(--accent) 45%,transparent); box-shadow:0 0 28px color-mix(in srgb,var(--accent) 14%,transparent); }
    .hint { position:fixed; right:28px; top:25px; z-index:2; color:rgba(255,255,255,.34); font-size:10px; letter-spacing:.13em; text-transform:uppercase; }
    .panel { position:fixed; z-index:3; left:50%; bottom:26px; transform:translateX(-50%); width:min(430px,calc(100vw - 28px)); padding:10px; border:1px solid rgba(255,255,255,.11); border-radius:20px; background:linear-gradient(145deg,rgba(28,28,34,.82),rgba(10,10,13,.72)); box-shadow:0 22px 80px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.07); backdrop-filter:blur(24px) saturate(135%); }
    .toprow { display:flex; gap:8px; }
    button { border:0; font:600 11px/1 inherit; letter-spacing:.05em; color:#fff; cursor:pointer; }
    .morph { flex:1; height:44px; border-radius:12px; background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 82%,#fff),color-mix(in srgb,var(--accent) 78%,#5325ff)); box-shadow:0 9px 26px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 1px rgba(255,255,255,.38); transition:transform .16s,filter .16s; }
    .morph:hover { filter:brightness(1.12); transform:translateY(-1px); }
    .morph:active { transform:translateY(1px) scale(.99); }
    .shape-name { min-width:92px; padding:0 14px; border-radius:12px; background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.08); color:rgba(255,255,255,.55); cursor:default; }
    .colors { display:flex; align-items:center; justify-content:center; gap:13px; height:47px; }
    .swatch { position:relative; width:19px; height:19px; padding:0; border-radius:50%; background:var(--c); box-shadow:0 0 15px color-mix(in srgb,var(--c) 42%,transparent),inset 0 0 0 1px rgba(255,255,255,.45); transition:transform .18s; }
    .swatch:hover { transform:scale(1.14); }
    .swatch.selected::after { content:""; position:absolute; inset:-5px; border:1px solid rgba(255,255,255,.78); border-radius:50%; }
    .footer { position:fixed; bottom:8px; left:0; right:0; z-index:2; text-align:center; color:rgba(255,255,255,.18); font-size:8px; letter-spacing:.18em; text-transform:uppercase; pointer-events:none; }
    @media (max-width:620px) { .hint{display:none}.brand{left:18px;top:19px}.status{top:17px}.panel{bottom:18px}.footer{display:none} }
    @media (prefers-reduced-motion:reduce) { .morph,.swatch,.status{transition:none} }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="可交互的三维粒子动画"></canvas>
  <div class="brand"><i class="mark"></i><span>PARTICLE / LAB</span></div>
  <div class="status" id="status">系统就绪</div>
  <div class="hint">拖动旋转 · 移动指针扰动</div>
  <section class="panel" aria-label="粒子控制面板">
    <div class="toprow">
      <button class="morph" id="morph">切换形状</button>
      <button class="shape-name" id="shapeName" tabindex="-1">金字塔</button>
    </div>
    <div class="colors" aria-label="选择粒子颜色">
      <button class="swatch selected" style="--c:#ff9e2a" data-color="#ff9e2a" aria-label="琥珀色"></button>
      <button class="swatch" style="--c:#9a6dff" data-color="#9a6dff" aria-label="紫罗兰"></button>
      <button class="swatch" style="--c:#2ce0c5" data-color="#2ce0c5" aria-label="青绿色"></button>
      <button class="swatch" style="--c:#ff4f87" data-color="#ff4f87" aria-label="玫红色"></button>
      <button class="swatch" style="--c:linear-gradient(90deg,#ff4545,#ffe34f,#42f58d,#45a6ff,#b848ff)" data-color="rainbow" aria-label="彩虹色"></button>
    </div>
  </section>
  <div class="footer">Canvas Particle System · No external dependencies</div>
  <script>
    (() => {
      const canvas = document.querySelector('#scene'), ctx = canvas.getContext('2d', { alpha:false });
      const status = document.querySelector('#status'), shapeName = document.querySelector('#shapeName');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TAU=Math.PI*2, COUNT=innerWidth<600?3400:innerWidth<1100?5400:7600;
      const names=['金字塔','球体','圆环','波浪'];
      let W,H,DPR,shape=0,color='#ff9e2a',morphing=0,rx=-.14,ry=.2,targetRx=rx,targetRy=ry,drag=false,lx=0,ly=0;
      const pointer={x:-9999,y:-9999,active:false};
      const particles=Array.from({length:COUNT},(_,i)=>({x:0,y:0,z:0,tx:0,ty:0,tz:0,seed:Math.random(),hue:i/COUNT}));
      const rnd=()=>Math.random();
      function pyramid(){
        const y=rnd()*2-1, half=(1-y)*.72+.018, edge=rnd()<.17;
        let x,z;
        if(edge){ const side=(rnd()*4)|0,t=rnd()*2-1; if(side===0){x=-half;z=t*half}else if(side===1){x=half;z=t*half}else if(side===2){x=t*half;z=-half}else{x=t*half;z=half} }
        else { const face=(rnd()*4)|0,t=rnd()*2-1; if(face===0){x=-half;z=t*half}else if(face===1){x=half;z=t*half}else if(face===2){x=t*half;z=-half}else{x=t*half;z=half} }
        return [x,y*.92,z];
      }
      function sphere(){ const u=rnd()*2-1,a=rnd()*TAU,r=Math.cbrt(.68+rnd()*.32); const s=Math.sqrt(1-u*u)*r; return [Math.cos(a)*s,u*r,Math.sin(a)*s]; }
      function torus(){ const a=rnd()*TAU,b=rnd()*TAU,R=.67,r=.25*(.45+rnd()*.55); return [(R+r*Math.cos(b))*Math.cos(a),r*Math.sin(b),(R+r*Math.cos(b))*Math.sin(a)]; }
      function wave(){ const x=rnd()*2-1,z=rnd()*2-1,y=Math.sin(x*5+z*2)*.19+Math.cos(z*5-x)*.13+(rnd()-.5)*.055; return [x,y,z]; }
      const makers=[pyramid,sphere,torus,wave];
      function setTargets(index,instant=false){
        shape=index; const make=makers[index];
        particles.forEach(p=>{const q=make();p.tx=q[0];p.ty=q[1];p.tz=q[2];if(instant){p.x=p.tx;p.y=p.ty;p.z=p.tz}});
        shapeName.textContent=names[index]; morphing=instant?0:1; status.textContent=instant?'系统就绪':'形态变换中…'; status.classList.toggle('active',!instant);
        if(!instant)setTimeout(()=>{morphing=0;status.textContent='形态稳定';status.classList.remove('active')},900);
      }
      function resize(){ DPR=Math.min(devicePixelRatio||1,1.75);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0); }
      function rgb(hex){ const n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255] }
      function frame(t){
        ctx.fillStyle='#050505';ctx.fillRect(0,0,W,H);
        if(!drag){targetRy+=reduceMotion?0:.0012; targetRx+=(Math.sin(t*.00025)*.11-targetRx)*.003}
        rx+=(targetRx-rx)*.08;ry+=(targetRy-ry)*.08;
        const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry), scale=Math.min(W,H)*.34;
        const base=color==='rainbow'?null:rgb(color), ease=morphing?.075:.04;
        const projected=[];
        for(const p of particles){
          p.x+=(p.tx-p.x)*ease;p.y+=(p.ty-p.y)*ease;p.z+=(p.tz-p.z)*ease;
          const x1=p.x*cy-p.z*sy,z1=p.x*sy+p.z*cy,y1=p.y*cx-z1*sx,z2=p.y*sx+z1*cx;
          const perspective=2.9/(3.25+z2),px=W/2+x1*scale*perspective,py=H*.47-y1*scale*perspective;
          let ox=0,oy=0;
          if(pointer.active){const dx=px-pointer.x,dy=py-pointer.y,d2=dx*dx+dy*dy;if(d2<12000){const f=(1-Math.sqrt(d2)/110)*15/(Math.sqrt(d2)+8);ox=dx*f;oy=dy*f}}
          projected.push([z2,px+ox,py+oy,p]);
        }
        projected.sort((a,b)=>b[0]-a[0]); ctx.globalCompositeOperation='lighter';
        for(const [z,x,y,p] of projected){
          const depth=Math.max(.18,1-(z+1.1)/3),a=.24+depth*.64,size=.55+depth*1.45;
          let c;if(base)c=`rgba(${base[0]},${base[1]},${base[2]},${a})`;else c=`hsla(${(p.hue*420+t*.025)%360},92%,63%,${a})`;
          ctx.fillStyle=c;ctx.fillRect(x,y,size,size);
          if(p.seed>.974){ctx.globalAlpha=.22;ctx.beginPath();ctx.arc(x,y,size*3.7,0,TAU);ctx.fill();ctx.globalAlpha=1}
        }
        ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame);
      }
      canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
      canvas.addEventListener('pointermove',e=>{pointer.x=e.clientX;pointer.y=e.clientY;pointer.active=true;if(drag){targetRy+=(e.clientX-lx)*.007;targetRx=Math.max(-1.2,Math.min(1.2,targetRx+(e.clientY-ly)*.007));lx=e.clientX;ly=e.clientY}});
      canvas.addEventListener('pointerup',()=>drag=false);canvas.addEventListener('pointerleave',()=>{drag=false;pointer.active=false});
      document.querySelector('#morph').addEventListener('click',()=>setTargets((shape+1)%makers.length));
      document.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>{document.querySelector('.swatch.selected')?.classList.remove('selected');el.classList.add('selected');color=el.dataset.color;document.documentElement.style.setProperty('--accent',color==='rainbow'?'#b848ff':color);status.textContent='颜色切换';status.classList.add('active');setTimeout(()=>{status.textContent='形态稳定';status.classList.remove('active')},500)}));
      addEventListener('resize',resize);resize();setTargets(0,true);requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
